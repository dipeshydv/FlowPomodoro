<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('flow_theme')||'dark'); })();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — FlowPomodoro</title>
  <meta name="description" content="Your FlowPomodoro dashboard. Track focus time, goals, and streaks.">
  <meta name="theme-color" content="#080B12">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/public/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/platform.css">
  <link rel="canonical" href="https://flowpomodoro.xyz/app/dashboard.html">
</head>
<body>

<div class="pf-layout" id="pf-layout">
  <div class="pf-content" id="pf-content">
    <main class="pf-page" id="main-content">
      <div class="stat-cards-grid" id="stat-cards-grid"></div>
      <div class="dashboard-grid" id="dashboard-grid">
        <div class="dashboard-goals">
          <div class="pf-panel" id="goals-panel">
            <div class="pf-panel-header">
              <span class="pf-panel-title">Today's Goals</span>
              <a href="/app/goals.html" class="pf-section-link">View all</a>
            </div>
            <div class="pf-panel-body" id="goals-panel-body"></div>
          </div>
        </div>
        <div class="dashboard-plan">
          <div class="pf-panel" id="plan-panel">
            <div class="pf-panel-header">
              <span class="pf-panel-title">Today's Plan</span>
              <a href="/app/planner.html" class="pf-section-link">Open Planner</a>
            </div>
            <div class="pf-panel-body" id="plan-panel-body"></div>
          </div>
        </div>
        <div class="dashboard-streak" id="streak-card-wrap"></div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="/js/platform/dashboard.js"></script>


</body></html>
