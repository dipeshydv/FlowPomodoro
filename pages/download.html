<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install FlowPomodoro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/pages/landing.css">
</head>

<body data-mode="focus">
    <div class="container text-center"
        style="padding: 4rem 2rem; max-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
        <h1>Install App</h1>
        <p>FlowPomodoro uses Progressive Web App technology. You don't need an app store.</p>
        <div class="glass-box" style="margin: 2rem auto; max-width: 500px; text-align: left;">
            <h3>How to Install:</h3>
            <ul>
                <li><strong>Chrome/Edge:</strong> Click the install icon in the URL bar.</li>
                <li><strong>iOS:</strong> Tap Share -> Add to Home Screen.</li>
                <li><strong>Android:</strong> Tap Menu -> Install App.</li>
            </ul>
        </div>
        <a href="index.html" class="btn-reset btn-primary">Open Web Version</a>
    </div>
</body>

</html>
